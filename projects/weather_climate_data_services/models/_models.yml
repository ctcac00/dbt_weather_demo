version: 2

groups:
  - name: data_services
    owner:
      name: Weather Data Services Team
      email: data-services@example.org

models:
  - name: data_service_regional_adoption
    description: "Regional weather data-service adoption base built only from public foundation marts."
    config:
      meta:
        primary_key: region
    columns:
      - name: region
        description: "Operational weather-service region."
        data_tests: [not_null, unique]
      - name: active_subscription_count
        description: "Active subscriptions in the region."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: total_subscription_count
        description: "Total subscriptions in the region."
      - name: active_monthly_fee_units
        description: "Monthly service unit total for active subscriptions in the region."
      - name: active_api_calls_30d
        description: "API calls from active subscriptions in the prior 30 days."
      - name: alert_opt_in_rate
        description: "Share of regional subscriptions opted into alert notifications."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: alert_count
        description: "Number of alerts in the region."
      - name: station_count
        description: "Number of stations represented in the region."
      - name: average_temperature_error_c
        description: "Average absolute temperature forecast error in Celsius for the region."
      - name: average_precipitation_error_mm
        description: "Average absolute precipitation forecast error in millimetres for the region."
      - name: api_calls_per_active_subscription
        description: "API call volume divided by active subscription count."

  - name: climate_data_service_adoption
    description: "Final report for climate and data-service adoption by region."
    latest_version: 1
    semantic_model:
      enabled: true
      name: climate_data_service_adoption
    agg_time_dimension: metric_date
    config:
      meta:
        primary_key: data_service_adoption_key
      access: public
      group: data_services
      contract:
        enforced: true
    versions:
      - v: 1
    columns:
      - name: data_service_adoption_key
        description: "Surrogate key for the region."
        data_type: varchar
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: data_service_adoption
      - name: metric_date
        description: "Current date used as the reporting metric date."
        data_type: date
        granularity: day
        dimension:
          type: time
      - name: region
        description: "Operational weather-service region."
        data_type: varchar
        dimension:
          type: categorical
        data_tests: [not_null, unique]
      - name: active_subscription_count
        description: "Active subscriptions in the region."
        data_type: number(18, 0)
      - name: total_subscription_count
        description: "Total subscriptions in the region."
        data_type: number(18, 0)
      - name: active_monthly_fee_units
        description: "Monthly service unit total for active subscriptions in the region."
        data_type: number(18, 2)
      - name: active_api_calls_30d
        description: "API calls from active subscriptions in the prior 30 days."
        data_type: number(18, 0)
      - name: alert_opt_in_rate
        description: "Share of regional subscriptions opted into alert notifications."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: alert_count
        description: "Number of alerts in the region."
        data_type: number(18, 0)
      - name: station_count
        description: "Number of stations represented in the region."
        data_type: number(18, 0)
      - name: average_temperature_error_c
        description: "Average absolute temperature forecast error in Celsius for the region."
        data_type: float
      - name: average_precipitation_error_mm
        description: "Average absolute precipitation forecast error in millimetres for the region."
        data_type: float
      - name: api_calls_per_active_subscription
        description: "API call volume divided by active subscription count."
        data_type: float
      - name: adoption_band
        description: "Regional data-service adoption segment."
        data_type: varchar
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['developing_adoption', 'moderate_adoption', 'high_adoption']
    metrics:
      - name: active_subscriptions
        description: "Active subscriptions represented in climate data-service reports."
        type: simple
        label: "Active subscriptions"
        agg: sum
        expr: active_subscription_count
      - name: active_api_calls
        description: "API calls from active subscriptions over the prior 30 days."
        type: simple
        label: "Active API calls"
        agg: sum
        expr: active_api_calls_30d
      - name: monthly_fee_units
        description: "Monthly service unit total for active subscriptions."
        type: simple
        label: "Monthly fee units"
        agg: sum
        expr: active_monthly_fee_units
      - name: average_alert_opt_in_rate
        description: "Average alert opt-in rate across reported segments."
        type: simple
        label: "Average alert opt-in rate"
        agg: average
        expr: alert_opt_in_rate

  - name: data_service_sector_scorecard
    description: "Sector and customer segment scorecard base built from the public subscription activity fact."
    config:
      meta:
        primary_key: sector, customer_segment, region
    columns:
      - name: sector
        description: "Sector served by the subscriptions."
        data_tests: [not_null]
      - name: customer_segment
        description: "Fictional customer segment receiving weather data services."
        data_tests: [not_null]
      - name: region
        description: "Primary service region for the subscriptions."
        data_tests: [not_null]
      - name: subscription_count
        description: "Total subscriptions in the sector, customer segment, and region."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: active_subscription_count
        description: "Active subscriptions in the sector, customer segment, and region."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: trial_subscription_count
        description: "Trial subscriptions in the sector, customer segment, and region."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: monthly_fee_units
        description: "Monthly service units across all subscriptions."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: active_monthly_fee_units
        description: "Monthly service units from active subscriptions."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: api_calls_30d
        description: "API calls over the prior 30 days across all subscriptions."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: active_api_calls_30d
        description: "API calls over the prior 30 days from active subscriptions."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: alert_opt_in_rate
        description: "Share of subscriptions opted into alert notifications."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: api_calls_per_active_subscription
        description: "Active API calls divided by active subscription count."

  - name: climate_data_service_sector_scorecard
    description: "Final sector and customer segment scorecard for climate data-service adoption."
    semantic_model:
      enabled: true
      name: climate_data_service_sector_scorecard
    agg_time_dimension: metric_date
    config:
      meta:
        primary_key: sector_scorecard_key
    columns:
      - name: sector_scorecard_key
        description: "Surrogate key for sector, customer segment, and region."
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: sector_scorecard
      - name: metric_date
        description: "Current date used as the reporting metric date."
        granularity: day
        dimension:
          type: time
      - name: sector
        description: "Sector served by the subscriptions."
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: customer_segment
        description: "Fictional customer segment receiving weather data services."
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: region
        description: "Primary service region for the subscriptions."
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: subscription_count
        description: "Total subscriptions in the scorecard segment."
      - name: active_subscription_count
        description: "Active subscriptions in the scorecard segment."
      - name: trial_subscription_count
        description: "Trial subscriptions in the scorecard segment."
      - name: monthly_fee_units
        description: "Monthly service units across all subscriptions."
      - name: active_monthly_fee_units
        description: "Monthly service units from active subscriptions."
      - name: active_api_calls_30d
        description: "API calls over the prior 30 days from active subscriptions."
      - name: alert_opt_in_rate
        description: "Share of subscriptions opted into alert notifications."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: api_calls_per_active_subscription
        description: "Active API calls divided by active subscription count."
      - name: service_engagement_band
        description: "Engagement band based on opt-in rate, active subscriptions, and API usage."
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['developing_engagement', 'steady_engagement', 'high_engagement']
