version: 2

semantic_models:
  - name: forecast_accuracy
    description: "Semantic model for public forecast accuracy outcomes."
    model: ref('fct_forecast_accuracy')
    defaults:
      agg_time_dimension: forecast_valid_date
    entities:
      - name: forecast_accuracy
        type: primary
        expr: forecast_accuracy_key
      - name: station
        type: foreign
        expr: station_id
    dimensions:
      - name: forecast_valid_date
        type: time
        type_params:
          time_granularity: day
      - name: region
        type: categorical
      - name: station_type
        type: categorical
      - name: sector_focus
        type: categorical
      - name: horizon_hours
        type: categorical
    measures:
      - name: forecast_count
        description: "Count of forecast accuracy records."
        agg: count
        expr: forecast_accuracy_key
      - name: average_temperature_error_c
        description: "Average absolute temperature forecast error in Celsius."
        agg: average
        expr: absolute_temperature_error_c
      - name: average_precipitation_error_mm
        description: "Average absolute precipitation forecast error in millimetres."
        agg: average
        expr: absolute_precipitation_error_mm
      - name: average_wind_gust_error_kph
        description: "Average absolute wind gust forecast error in kilometres per hour."
        agg: average
        expr: absolute_wind_gust_error_kph

  - name: weather_alert_impact
    description: "Semantic model for public weather alert impact outcomes."
    model: ref('fct_weather_alert_impact')
    defaults:
      agg_time_dimension: valid_from
    entities:
      - name: alert_impact
        type: primary
        expr: alert_impact_key
      - name: station
        type: foreign
        expr: station_id
    dimensions:
      - name: valid_from
        type: time
        type_params:
          time_granularity: day
      - name: region
        type: categorical
      - name: severity
        type: categorical
      - name: alert_type
        type: categorical
      - name: status
        type: categorical
    measures:
      - name: alert_count
        description: "Count of weather alerts."
        agg: count
        expr: alert_impact_key
      - name: incident_count
        description: "Observed incident count associated with weather alerts."
        agg: sum
        expr: observed_incidents
      - name: affected_population
        description: "Estimated population affected by weather alerts."
        agg: sum
        expr: affected_population_estimate
      - name: weighted_impact
        description: "Severity-weighted expected impact score."
        agg: sum
        expr: weighted_impact_score

  - name: service_subscription_activity
    description: "Semantic model for public subscription-level service activity."
    model: ref('fct_service_subscription_activity')
    defaults:
      agg_time_dimension: started_at
    entities:
      - name: service_subscription
        type: primary
        expr: subscription_activity_key
    dimensions:
      - name: started_at
        type: time
        type_params:
          time_granularity: day
      - name: customer_segment
        type: categorical
      - name: sector
        type: categorical
      - name: region
        type: categorical
      - name: service_tier
        type: categorical
      - name: status
        type: categorical
    measures:
      - name: subscription_count
        description: "Count of service subscriptions."
        agg: count
        expr: subscription_activity_key
      - name: active_subscription_count
        description: "Count of active service subscriptions."
        agg: sum
        expr: case when is_active_subscription then 1 else 0 end
      - name: monthly_fee_units
        description: "Monthly subscription fee units."
        agg: sum
        expr: monthly_fee_units
      - name: active_api_calls_30d
        description: "API call volume from active subscriptions over the prior 30 days."
        agg: sum
        expr: active_api_calls_30d

metrics:
  - name: forecast_count
    description: "Count of forecast accuracy records."
    type: simple
    label: "Forecast count"
    type_params:
      measure: forecast_count
  - name: average_temperature_error_c
    description: "Average absolute temperature forecast error in Celsius."
    type: simple
    label: "Average temperature error (C)"
    type_params:
      measure: average_temperature_error_c
  - name: average_precipitation_error_mm
    description: "Average absolute precipitation forecast error in millimetres."
    type: simple
    label: "Average precipitation error (mm)"
    type_params:
      measure: average_precipitation_error_mm
  - name: alert_count
    description: "Count of weather alerts."
    type: simple
    label: "Alert count"
    type_params:
      measure: alert_count
  - name: incident_count
    description: "Observed incident count associated with weather alerts."
    type: simple
    label: "Incident count"
    type_params:
      measure: incident_count
  - name: affected_population
    description: "Estimated population affected by weather alerts."
    type: simple
    label: "Affected population"
    type_params:
      measure: affected_population
  - name: weighted_impact
    description: "Severity-weighted expected impact score."
    type: simple
    label: "Weighted impact"
    type_params:
      measure: weighted_impact
  - name: subscription_count
    description: "Count of service subscriptions."
    type: simple
    label: "Subscription count"
    type_params:
      measure: subscription_count
  - name: active_subscription_count
    description: "Count of active service subscriptions."
    type: simple
    label: "Active subscription count"
    type_params:
      measure: active_subscription_count
  - name: monthly_fee_units
    description: "Monthly subscription fee units."
    type: simple
    label: "Monthly fee units"
    type_params:
      measure: monthly_fee_units
  - name: active_api_calls_30d
    description: "API call volume from active subscriptions over the prior 30 days."
    type: simple
    label: "Active API calls 30d"
    type_params:
      measure: active_api_calls_30d
