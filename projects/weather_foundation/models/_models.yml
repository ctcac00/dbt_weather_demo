version: 2

groups:
  - name: foundation
    owner:
      name: Weather Data Platform Team
      email: data-platform@example.org

models:
  - name: stg_stations
    description: "Typed station inventory staged from raw seed data."
    config:
      meta:
        primary_key: station_id
    columns:
      - name: station_id
        description: "Stable station identifier."
        data_tests: [not_null, unique]
      - name: station_name
        description: "Human-readable station name."
        data_tests: [not_null]
      - name: region
        description: "Operational region served by the station."
        data_tests: [not_null]
      - name: country_code
        description: "Fictional demo country code."
        data_tests: [not_null]
      - name: latitude
        description: "Station latitude."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 90
      - name: longitude
        description: "Station longitude."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -180
                max_value: 180
      - name: elevation_m
        description: "Station elevation in metres."
      - name: station_type
        description: "Station operating context."
        data_tests:
          - accepted_values:
              arguments:
                values: ['coastal', 'urban', 'upland', 'airport', 'hydrology', 'transport', 'rural']
      - name: sector_focus
        description: "Primary sector supported by the station."
        data_tests: [not_null]
      - name: opened_date
        description: "Date the station opened."
      - name: is_active
        description: "Whether the station currently participates in service reporting."

  - name: stg_observations
    description: "Typed station observations staged from raw telemetry seed data."
    config:
      meta:
        primary_key: observation_id
    columns:
      - name: observation_id
        description: "Stable observation identifier."
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station that produced the observation."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stations')
                field: station_id
      - name: observed_at
        description: "Timestamp when the observation was recorded."
        data_tests: [not_null]
      - name: temperature_c
        description: "Observed air temperature in Celsius."
      - name: precipitation_mm
        description: "Observed precipitation in millimetres."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: wind_speed_kph
        description: "Observed sustained wind speed in kilometres per hour."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: wind_gust_kph
        description: "Observed wind gust speed in kilometres per hour."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: visibility_km
        description: "Observed visibility in kilometres."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: humidity_pct
        description: "Observed relative humidity percentage."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: pressure_hpa
        description: "Observed atmospheric pressure in hectopascals."

  - name: stg_forecasts
    description: "Typed forecast outcomes paired to observed values."
    config:
      meta:
        primary_key: forecast_id
    columns:
      - name: forecast_id
        description: "Stable forecast identifier."
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station for the forecast point."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stations')
                field: station_id
      - name: issued_at
        description: "Timestamp the forecast was issued."
        data_tests: [not_null]
      - name: valid_at
        description: "Timestamp the forecast was valid for."
        data_tests: [not_null]
      - name: horizon_hours
        description: "Forecast horizon in hours."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 240
      - name: forecast_temperature_c
        description: "Forecast temperature in Celsius."
      - name: observed_temperature_c
        description: "Observed temperature in Celsius."
      - name: forecast_precipitation_mm
        description: "Forecast precipitation in millimetres."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: observed_precipitation_mm
        description: "Observed precipitation in millimetres."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: forecast_wind_gust_kph
        description: "Forecast wind gust speed in kilometres per hour."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: observed_wind_gust_kph
        description: "Observed wind gust speed in kilometres per hour."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: model_run_id
        description: "Weather forecast model run identifier."
        data_tests: [not_null]

  - name: stg_weather_alerts
    description: "Typed weather alerts staged from operational alert seed data."
    config:
      meta:
        primary_key: alert_id
    columns:
      - name: alert_id
        description: "Stable alert identifier."
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station most directly associated with the alert."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stations')
                field: station_id
      - name: region
        description: "Operational weather-service region for the alert."
        data_tests: [not_null]
      - name: issued_at
        description: "Timestamp the alert was issued."
        data_tests: [not_null]
      - name: valid_from
        description: "Timestamp the alert validity window starts."
        data_tests: [not_null]
      - name: valid_to
        description: "Timestamp the alert validity window ends."
        data_tests: [not_null]
      - name: severity
        description: "Alert severity level."
        data_tests:
          - accepted_values:
              arguments:
                values: ['yellow', 'amber', 'red']
      - name: alert_type
        description: "Alert hazard type."
        data_tests: [not_null]
      - name: status
        description: "Current alert lifecycle status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['issued', 'expired', 'cancelled']
      - name: expected_impact_score
        description: "Expected service impact score."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: observed_incidents
        description: "Observed incident count associated with the alert."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: affected_population_estimate
        description: "Estimated population covered by the alert."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  - name: stg_service_subscriptions
    description: "Typed weather data-service subscription records."
    config:
      meta:
        primary_key: subscription_id
    columns:
      - name: subscription_id
        description: "Stable subscription identifier."
        data_tests: [not_null, unique]
      - name: customer_segment
        description: "Fictional customer segment receiving weather data services."
        data_tests: [not_null]
      - name: sector
        description: "Sector served by the subscription."
        data_tests: [not_null]
      - name: region
        description: "Primary service region for the subscription."
        data_tests: [not_null]
      - name: service_tier
        description: "Subscription service tier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard', 'professional', 'enterprise']
      - name: started_at
        description: "Date the subscription started."
      - name: status
        description: "Subscription lifecycle status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'paused', 'trial']
      - name: monthly_fee_units
        description: "Monthly subscription fee in neutral demo service units."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: api_calls_30d
        description: "API call volume over the prior 30 days."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: alert_opt_in
        description: "Whether the subscription receives alert notifications."

  - name: int_forecast_accuracy
    description: "Forecast error metrics enriched with station geography and sector focus."
    config:
      meta:
        primary_key: forecast_accuracy_key
    columns:
      - name: forecast_accuracy_key
        description: "Surrogate key for the forecast accuracy record."
        data_tests: [not_null, unique]
      - name: forecast_id
        description: "Stable forecast identifier."
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station for the forecast point."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stations')
                field: station_id
      - name: region
        description: "Operational weather-service region."
      - name: station_type
        description: "Station operating context."
      - name: sector_focus
        description: "Primary sector supported by the station."
      - name: issued_at
        description: "Timestamp the forecast was issued."
      - name: valid_at
        description: "Timestamp the forecast was valid for."
      - name: forecast_valid_date
        description: "Date the forecast was valid for."
      - name: horizon_hours
        description: "Forecast horizon in hours."
      - name: model_run_id
        description: "Weather forecast model run identifier."
      - name: forecast_temperature_c
        description: "Forecast temperature in Celsius."
      - name: observed_temperature_c
        description: "Observed temperature in Celsius."
      - name: absolute_temperature_error_c
        description: "Absolute temperature forecast error in Celsius."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: forecast_precipitation_mm
        description: "Forecast precipitation in millimetres."
      - name: observed_precipitation_mm
        description: "Observed precipitation in millimetres."
      - name: absolute_precipitation_error_mm
        description: "Absolute precipitation forecast error in millimetres."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: forecast_wind_gust_kph
        description: "Forecast wind gust speed in kilometres per hour."
      - name: observed_wind_gust_kph
        description: "Observed wind gust speed in kilometres per hour."
      - name: absolute_wind_gust_error_kph
        description: "Absolute wind gust forecast error in kilometres per hour."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: temperature_within_one_degree
        description: "Whether the forecast temperature was within one degree Celsius."
      - name: precipitation_event_correct
        description: "Whether the forecast and observed precipitation event classification matched."
      - name: precipitation_error_ratio
        description: "Absolute precipitation error divided by observed precipitation, null when not applicable."

  - name: int_service_adoption_by_region
    description: "Regional rollup of active weather data-service subscriptions."
    config:
      meta:
        primary_key: region
    columns:
      - name: region
        description: "Operational region."
        data_tests: [not_null, unique]
      - name: active_subscription_count
        description: "Active subscriptions in the region."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: total_subscription_count
        description: "Total subscriptions in the region."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: active_monthly_fee_units
        description: "Monthly service unit total for active subscriptions in the region."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: active_api_calls_30d
        description: "API call volume from active subscriptions over the prior 30 days."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: alert_opt_in_rate
        description: "Share of subscriptions that receive alert notifications."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_alerts_enriched
    description: "Alert impact records enriched with station context and regional service adoption."
    config:
      meta:
        primary_key: alert_id
    columns:
      - name: alert_id
        description: "Stable alert identifier."
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station most directly associated with the alert."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stations')
                field: station_id
      - name: station_name
        description: "Human-readable station name."
      - name: region
        description: "Operational weather-service region."
      - name: station_type
        description: "Station operating context."
      - name: sector_focus
        description: "Primary sector supported by the station."
      - name: issued_at
        description: "Timestamp the alert was issued."
      - name: valid_from
        description: "Timestamp the alert validity window starts."
      - name: valid_to
        description: "Timestamp the alert validity window ends."
      - name: alert_duration_hours
        description: "Alert validity duration in hours."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: severity
        description: "Alert severity level."
        data_tests:
          - accepted_values:
              arguments:
                values: ['yellow', 'amber', 'red']
      - name: alert_type
        description: "Alert hazard type."
      - name: status
        description: "Current alert lifecycle status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['issued', 'expired', 'cancelled']
      - name: expected_impact_score
        description: "Expected service impact score."
      - name: observed_incidents
        description: "Observed incident count associated with the alert."
      - name: affected_population_estimate
        description: "Estimated population covered by the alert."
      - name: incidents_per_100k_population
        description: "Observed incidents per 100,000 affected residents."
      - name: active_subscription_count
        description: "Active data-service subscriptions in the alert region."
      - name: total_subscription_count
        description: "Total subscriptions in the alert region."
      - name: active_monthly_fee_units
        description: "Monthly service unit total for active subscriptions in the alert region."
      - name: active_api_calls_30d
        description: "API calls from active subscriptions in the prior 30 days."
      - name: alert_opt_in_rate
        description: "Share of regional subscriptions opted into alert notifications."
      - name: severity_weight
        description: "Numeric weight applied to alert severity."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 3

  - name: dim_station
    description: "Public dimension of weather stations for mesh consumers."
    latest_version: 1
    config:
      meta:
        primary_key: station_key
      access: public
      group: foundation
      contract:
        enforced: true
    versions:
      - v: 1
    columns:
      - name: station_key
        description: "Surrogate key for the station."
        data_type: varchar
        data_tests: [not_null, unique]
      - name: station_id
        description: "Stable station identifier."
        data_type: varchar
        data_tests: [not_null, unique]
      - name: station_name
        description: "Human-readable station name."
        data_type: varchar
      - name: region
        description: "Operational weather-service region."
        data_type: varchar
      - name: country_code
        description: "Fictional demo country code for the station."
        data_type: varchar
      - name: latitude
        description: "Station latitude."
        data_type: float
      - name: longitude
        description: "Station longitude."
        data_type: float
      - name: elevation_m
        description: "Station elevation in metres."
        data_type: number(10, 0)
      - name: station_type
        description: "Station operating context."
        data_type: varchar
      - name: sector_focus
        description: "Primary sector supported by the station."
        data_type: varchar
      - name: opened_date
        description: "Date the station opened."
        data_type: date
      - name: is_active
        description: "Whether the station is active."
        data_type: boolean

  - name: fct_forecast_accuracy
    description: "Public forecast accuracy fact at one row per forecast and valid timestamp."
    latest_version: 1
    semantic_model:
      enabled: true
      name: forecast_accuracy
    agg_time_dimension: forecast_valid_date
    config:
      meta:
        primary_key: forecast_accuracy_key
      access: public
      group: foundation
      contract:
        enforced: true
    versions:
      - v: 1
    columns:
      - name: forecast_accuracy_key
        description: "Surrogate key for the forecast accuracy record."
        data_type: varchar
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: forecast_accuracy
      - name: forecast_id
        description: "Stable forecast identifier."
        data_type: varchar
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station for the forecast point."
        data_type: varchar
        entity:
          type: foreign
          name: station
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: region
        description: "Operational weather-service region."
        data_type: varchar
        dimension:
          type: categorical
      - name: station_type
        description: "Station operating context."
        data_type: varchar
        dimension:
          type: categorical
      - name: sector_focus
        description: "Primary sector supported by the station."
        data_type: varchar
        dimension:
          type: categorical
      - name: issued_at
        description: "Timestamp the forecast was issued."
        data_type: timestamp_ntz
      - name: valid_at
        description: "Timestamp the forecast was valid for."
        data_type: timestamp_ntz
      - name: forecast_valid_date
        description: "Date the forecast was valid for."
        data_type: date
        granularity: day
        dimension:
          type: time
      - name: horizon_hours
        description: "Forecast horizon in hours."
        data_type: number(10, 0)
        dimension:
          type: categorical
      - name: model_run_id
        description: "Weather forecast model run identifier."
        data_type: varchar
      - name: forecast_temperature_c
        description: "Forecast temperature in Celsius."
        data_type: float
      - name: observed_temperature_c
        description: "Observed temperature in Celsius."
        data_type: float
      - name: absolute_temperature_error_c
        description: "Absolute temperature forecast error in Celsius."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: forecast_precipitation_mm
        description: "Forecast precipitation in millimetres."
        data_type: float
      - name: observed_precipitation_mm
        description: "Observed precipitation in millimetres."
        data_type: float
      - name: absolute_precipitation_error_mm
        description: "Absolute precipitation forecast error in millimetres."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: forecast_wind_gust_kph
        description: "Forecast wind gust speed in kilometres per hour."
        data_type: float
      - name: observed_wind_gust_kph
        description: "Observed wind gust speed in kilometres per hour."
        data_type: float
      - name: absolute_wind_gust_error_kph
        description: "Absolute wind gust forecast error in kilometres per hour."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: temperature_within_one_degree
        description: "Whether the forecast temperature was within one degree Celsius."
        data_type: boolean
      - name: precipitation_event_correct
        description: "Whether the forecast and observed precipitation event classification matched."
        data_type: boolean
      - name: precipitation_error_ratio
        description: "Absolute precipitation error divided by observed precipitation, null when not applicable."
        data_type: float
    metrics:
      - name: forecast_count
        description: "Count of forecast accuracy records."
        type: simple
        label: "Forecast count"
        agg: count
        expr: forecast_accuracy_key
      - name: average_temperature_error_c
        description: "Average absolute temperature forecast error in Celsius."
        type: simple
        label: "Average temperature error (C)"
        agg: average
        expr: absolute_temperature_error_c
      - name: average_precipitation_error_mm
        description: "Average absolute precipitation forecast error in millimetres."
        type: simple
        label: "Average precipitation error (mm)"
        agg: average
        expr: absolute_precipitation_error_mm

  - name: fct_weather_alert_impact
    description: "Public alert impact fact at one row per issued weather alert."
    latest_version: 1
    semantic_model:
      enabled: true
      name: weather_alert_impact
    agg_time_dimension: valid_from
    config:
      meta:
        primary_key: alert_impact_key
      access: public
      group: foundation
      contract:
        enforced: true
    versions:
      - v: 1
    columns:
      - name: alert_impact_key
        description: "Surrogate key for the alert impact record."
        data_type: varchar
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: alert_impact
      - name: alert_id
        description: "Stable alert identifier."
        data_type: varchar
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station most directly associated with the alert."
        data_type: varchar
        entity:
          type: foreign
          name: station
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: station_name
        description: "Human-readable station name."
        data_type: varchar
      - name: region
        description: "Operational weather-service region."
        data_type: varchar
        dimension:
          type: categorical
      - name: station_type
        description: "Station operating context."
        data_type: varchar
      - name: sector_focus
        description: "Primary sector supported by the station."
        data_type: varchar
      - name: issued_at
        description: "Timestamp the alert was issued."
        data_type: timestamp_ntz
      - name: valid_from
        description: "Timestamp the alert validity window starts."
        data_type: timestamp_ntz
        granularity: day
        dimension:
          type: time
      - name: valid_to
        description: "Timestamp the alert validity window ends."
        data_type: timestamp_ntz
      - name: alert_duration_hours
        description: "Alert validity duration in hours."
        data_type: number(10, 0)
      - name: severity
        description: "Alert severity level."
        data_type: varchar
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['yellow', 'amber', 'red']
      - name: alert_type
        description: "Alert hazard type."
        data_type: varchar
        dimension:
          type: categorical
      - name: status
        description: "Current alert lifecycle status."
        data_type: varchar
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['issued', 'expired', 'cancelled']
      - name: expected_impact_score
        description: "Expected service impact score."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: observed_incidents
        description: "Observed incident count associated with the alert."
        data_type: number(10, 0)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: affected_population_estimate
        description: "Estimated population covered by the alert."
        data_type: number(18, 0)
      - name: incidents_per_100k_population
        description: "Observed incidents per 100,000 affected residents."
        data_type: float
      - name: active_subscription_count
        description: "Active data-service subscriptions in the alert region."
        data_type: number(18, 0)
      - name: total_subscription_count
        description: "Total subscriptions in the alert region."
        data_type: number(18, 0)
      - name: active_monthly_fee_units
        description: "Monthly service unit total for active subscriptions in the alert region."
        data_type: number(18, 2)
      - name: active_api_calls_30d
        description: "API calls from active subscriptions in the prior 30 days."
        data_type: number(18, 0)
      - name: alert_opt_in_rate
        description: "Share of regional subscriptions opted into alert notifications."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: severity_weight
        description: "Numeric weight applied to alert severity."
        data_type: number(10, 0)
      - name: weighted_impact_score
        description: "Expected impact score multiplied by severity weight."
        data_type: float
    metrics:
      - name: alert_count
        description: "Count of weather alerts."
        type: simple
        label: "Alert count"
        agg: count
        expr: alert_impact_key
      - name: incident_count
        description: "Observed incident count associated with weather alerts."
        type: simple
        label: "Incident count"
        agg: sum
        expr: observed_incidents
      - name: affected_population
        description: "Estimated population affected by weather alerts."
        type: simple
        label: "Affected population"
        agg: sum
        expr: affected_population_estimate
      - name: weighted_impact
        description: "Severity-weighted expected impact score."
        type: simple
        label: "Weighted impact"
        agg: sum
        expr: weighted_impact_score

  - name: fct_station_daily_conditions
    description: "Public station-day fact of observed weather conditions enriched with station context."
    latest_version: 1
    config:
      meta:
        primary_key: station_daily_conditions_key
      access: public
      group: foundation
      contract:
        enforced: true
    versions:
      - v: 1
    columns:
      - name: station_daily_conditions_key
        description: "Surrogate key for the station and observation date."
        data_type: varchar
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station that produced the observations."
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: station_name
        description: "Human-readable station name."
        data_type: varchar
      - name: region
        description: "Operational weather-service region."
        data_type: varchar
      - name: station_type
        description: "Station operating context."
        data_type: varchar
      - name: sector_focus
        description: "Primary sector supported by the station."
        data_type: varchar
      - name: observation_date
        description: "Date of the observed station conditions."
        data_type: date
        data_tests: [not_null]
      - name: observation_count
        description: "Number of observations contributing to the station-day."
        data_type: number(18, 0)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: average_temperature_c
        description: "Average observed air temperature in Celsius."
        data_type: float
      - name: minimum_temperature_c
        description: "Minimum observed air temperature in Celsius."
        data_type: float
      - name: maximum_temperature_c
        description: "Maximum observed air temperature in Celsius."
        data_type: float
      - name: total_precipitation_mm
        description: "Total observed precipitation in millimetres."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: average_wind_speed_kph
        description: "Average observed sustained wind speed in kilometres per hour."
        data_type: float
      - name: maximum_wind_gust_kph
        description: "Maximum observed wind gust speed in kilometres per hour."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: minimum_visibility_km
        description: "Minimum observed visibility in kilometres."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: average_humidity_pct
        description: "Average observed relative humidity percentage."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: average_pressure_hpa
        description: "Average observed atmospheric pressure in hectopascals."
        data_type: float
      - name: precipitation_observed
        description: "Whether any precipitation was observed during the station-day."
        data_type: boolean
      - name: low_visibility_observed
        description: "Whether visibility dropped below five kilometres during the station-day."
        data_type: boolean
      - name: high_wind_observed
        description: "Whether a wind gust at or above 50 kph was observed during the station-day."
        data_type: boolean
      - name: freezing_observed
        description: "Whether temperature reached freezing or below during the station-day."
        data_type: boolean

  - name: fct_service_subscription_activity
    description: "Public subscription-level service activity fact for weather data-service consumers."
    latest_version: 1
    semantic_model:
      enabled: true
      name: service_subscription_activity
    agg_time_dimension: started_at
    config:
      meta:
        primary_key: subscription_activity_key
      access: public
      group: foundation
      contract:
        enforced: true
    versions:
      - v: 1
    columns:
      - name: subscription_activity_key
        description: "Surrogate key for the service subscription."
        data_type: varchar
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: service_subscription
      - name: subscription_id
        description: "Stable subscription identifier."
        data_type: varchar
        data_tests: [not_null, unique]
      - name: customer_segment
        description: "Fictional customer segment receiving weather data services."
        data_type: varchar
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: sector
        description: "Sector served by the subscription."
        data_type: varchar
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: region
        description: "Primary service region for the subscription."
        data_type: varchar
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: service_tier
        description: "Subscription service tier."
        data_type: varchar
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard', 'professional', 'enterprise']
      - name: started_at
        description: "Date the subscription started."
        data_type: date
        granularity: day
        dimension:
          type: time
      - name: status
        description: "Subscription lifecycle status."
        data_type: varchar
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'paused', 'trial']
      - name: is_active_subscription
        description: "Whether the subscription is currently active."
        data_type: boolean
      - name: is_trial_subscription
        description: "Whether the subscription is currently in trial."
        data_type: boolean
      - name: monthly_fee_units
        description: "Monthly subscription fee in neutral demo service units."
        data_type: number(12, 2)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: api_calls_30d
        description: "API call volume over the prior 30 days."
        data_type: number(18, 0)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: alert_opt_in
        description: "Whether the subscription receives alert notifications."
        data_type: boolean
      - name: active_monthly_fee_units
        description: "Monthly service units from active subscriptions only."
        data_type: number(12, 2)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: active_api_calls_30d
        description: "API call volume from active subscriptions over the prior 30 days."
        data_type: number(18, 0)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
    metrics:
      - name: subscription_count
        description: "Count of service subscriptions."
        type: simple
        label: "Subscription count"
        agg: count
        expr: subscription_activity_key
      - name: active_subscription_count
        description: "Count of active service subscriptions."
        type: simple
        label: "Active subscription count"
        agg: sum
        expr: case when is_active_subscription then 1 else 0 end
      - name: monthly_fee_units
        description: "Monthly subscription fee units."
        type: simple
        label: "Monthly fee units"
        agg: sum
        expr: monthly_fee_units
      - name: active_api_calls_30d
        description: "API call volume from active subscriptions over the prior 30 days."
        type: simple
        label: "Active API calls 30d"
        agg: sum
        expr: active_api_calls_30d
