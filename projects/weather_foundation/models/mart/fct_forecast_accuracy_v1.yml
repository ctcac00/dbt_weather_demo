version: 2

models:
  - name: fct_forecast_accuracy
    description: "Public forecast accuracy fact at one row per forecast and valid timestamp."
    latest_version: 1
    semantic_model:
      enabled: true
      name: forecast_accuracy
    agg_time_dimension: forecast_valid_date
    config:
      meta:
        primary_key: forecast_accuracy_key
      access: public
      group: foundation
      contract:
        enforced: true
    versions:
      - v: 1
    columns:
      - name: forecast_accuracy_key
        description: "Surrogate key for the forecast accuracy record."
        data_type: varchar
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: forecast_accuracy
      - name: forecast_id
        description: "Stable forecast identifier."
        data_type: varchar
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station for the forecast point."
        data_type: varchar
        entity:
          type: foreign
          name: station
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: region
        description: "Operational weather-service region."
        data_type: varchar
        dimension:
          type: categorical
      - name: station_type
        description: "Station operating context."
        data_type: varchar
        dimension:
          type: categorical
      - name: sector_focus
        description: "Primary sector supported by the station."
        data_type: varchar
        dimension:
          type: categorical
      - name: issued_at
        description: "Timestamp the forecast was issued."
        data_type: timestamp_ntz
      - name: valid_at
        description: "Timestamp the forecast was valid for."
        data_type: timestamp_ntz
      - name: forecast_valid_date
        description: "Date the forecast was valid for."
        data_type: date
        granularity: day
        dimension:
          type: time
      - name: horizon_hours
        description: "Forecast horizon in hours."
        data_type: number(10, 0)
        dimension:
          type: categorical
      - name: model_run_id
        description: "Weather forecast model run identifier."
        data_type: varchar
      - name: forecast_temperature_c
        description: "Forecast temperature in Celsius."
        data_type: float
      - name: observed_temperature_c
        description: "Observed temperature in Celsius."
        data_type: float
      - name: absolute_temperature_error_c
        description: "Absolute temperature forecast error in Celsius."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: forecast_precipitation_mm
        description: "Forecast precipitation in millimetres."
        data_type: float
      - name: observed_precipitation_mm
        description: "Observed precipitation in millimetres."
        data_type: float
      - name: absolute_precipitation_error_mm
        description: "Absolute precipitation forecast error in millimetres."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: forecast_wind_gust_kph
        description: "Forecast wind gust speed in kilometres per hour."
        data_type: float
      - name: observed_wind_gust_kph
        description: "Observed wind gust speed in kilometres per hour."
        data_type: float
      - name: absolute_wind_gust_error_kph
        description: "Absolute wind gust forecast error in kilometres per hour."
        data_type: float
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: temperature_within_one_degree
        description: "Whether the forecast temperature was within one degree Celsius."
        data_type: boolean
      - name: precipitation_event_correct
        description: "Whether the forecast and observed precipitation event classification matched."
        data_type: boolean
      - name: precipitation_error_ratio
        description: "Absolute precipitation error divided by observed precipitation, null when not applicable."
        data_type: float
    metrics:
      - name: forecast_count
        description: "Count of forecast accuracy records."
        type: simple
        label: "Forecast count"
        agg: count
        expr: forecast_accuracy_key
      - name: average_temperature_error_c
        description: "Average absolute temperature forecast error in Celsius."
        type: simple
        label: "Average temperature error (C)"
        agg: average
        expr: absolute_temperature_error_c
      - name: average_precipitation_error_mm
        description: "Average absolute precipitation forecast error in millimetres."
        type: simple
        label: "Average precipitation error (mm)"
        agg: average
        expr: absolute_precipitation_error_mm
