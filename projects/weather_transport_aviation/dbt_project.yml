name: 'weather_transport_aviation'
version: '1.0.0'
config-version: 2

profile: 'weather'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  weather_transport_aviation:
    +persist_docs:
      relation: true
      columns: true
    reporting:
      +materialized: view
      +schema: reporting
    reports:
      +materialized: table
      +schema: reports
