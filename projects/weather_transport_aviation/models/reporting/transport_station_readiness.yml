version: 2

models:
  - name: transport_station_readiness
    description: "Transport station-day readiness base joining foundation station readiness with regional service context."
    config:
      meta:
        primary_key: station_weather_readiness_key
    columns:
      - name: station_weather_readiness_key
        description: "Foundation station weather readiness surrogate key."
        data_tests: [not_null, unique]
      - name: station_daily_conditions_key
        description: "Foundation station-day conditions surrogate key."
      - name: station_id
        description: "Station represented by the readiness record."
        data_tests: [not_null]
      - name: station_name
        description: "Human-readable station name."
      - name: region
        description: "Operational weather-service region."
        data_tests: [not_null]
      - name: station_type
        description: "Station operating context."
      - name: sector_focus
        description: "Primary sector supported by the station."
      - name: operating_sector
        description: "Transport operating sector inferred from station context."
        data_tests:
          - accepted_values:
              arguments:
                values: ['aviation', 'rail', 'road', 'general_transport']
      - name: readiness_date
        description: "Station-day readiness date."
        data_tests: [not_null]
      - name: observation_count
        description: "Number of observations contributing to the station-day."
      - name: maximum_wind_gust_kph
        description: "Maximum observed wind gust speed in kilometres per hour."
      - name: minimum_visibility_km
        description: "Minimum observed visibility in kilometres."
      - name: low_visibility_observed
        description: "Whether low visibility was observed during the station-day."
      - name: high_wind_observed
        description: "Whether high wind was observed during the station-day."
      - name: freezing_observed
        description: "Whether freezing conditions were observed during the station-day."
      - name: forecast_count
        description: "Forecast records valid for the station-day."
      - name: average_temperature_error_c
        description: "Average absolute temperature forecast error in Celsius."
      - name: average_precipitation_error_mm
        description: "Average absolute precipitation forecast error in millimetres."
      - name: average_wind_gust_error_kph
        description: "Average absolute wind gust forecast error in kilometres per hour."
      - name: precipitation_miss_observed
        description: "Whether precipitation event classification missed on the station-day."
      - name: alert_count
        description: "Alerts active from the station on the readiness date."
      - name: maximum_alert_severity_weight
        description: "Maximum alert severity weight for the station-day."
      - name: maximum_weighted_impact_score
        description: "Maximum weighted alert impact score for the station-day."
      - name: observed_incidents
        description: "Observed incidents associated with station-day alerts."
      - name: active_subscription_count
        description: "Active data-service subscriptions in the station region."
      - name: active_api_calls_30d
        description: "API calls from active regional subscriptions over the prior 30 days."
      - name: regional_alert_opt_in_rate
        description: "Share of regional subscriptions opted into alert notifications."
      - name: active_sector_subscription_count
        description: "Active subscriptions in the station region and sector focus."
      - name: active_sector_api_calls_30d
        description: "API calls from active subscriptions in the station region and sector focus."
      - name: weather_readiness_score
        description: "Foundation station weather readiness score."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: weather_readiness_band
        description: "Foundation station weather readiness band."
        data_tests:
          - accepted_values:
              arguments:
                values: ['ready', 'enhanced_monitoring', 'strained_readiness', 'critical_gap']
      - name: region_service_context_key
        description: "Foundation regional service context surrogate key."
        data_tests: [not_null]
      - name: service_context_band
        description: "Regional service maturity band."
      - name: airport_station_count
        description: "Airport station count in the region."
      - name: transport_station_count
        description: "Transport station count in the region."
      - name: transport_readiness_status
        description: "Transport-specific readiness status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['normal_operations', 'operational_constraints', 'ground_stop_watch']
