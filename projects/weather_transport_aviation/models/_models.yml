version: 2

models:
  - name: sector_operating_risk
    description: "Transport and aviation risk base built only from public foundation forecast and alert marts."
    config:
      meta:
        primary_key: forecast_accuracy_key
    columns:
      - name: forecast_accuracy_key
        description: "Foundation forecast accuracy surrogate key."
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station for the forecast point."
        data_tests: [not_null]
      - name: region
        description: "Operational weather-service region."
      - name: station_type
        description: "Station operating context."
      - name: sector_focus
        description: "Primary sector supported by the station."
      - name: operating_sector
        description: "Transport operating sector inferred from station context."
        data_tests:
          - accepted_values:
              arguments:
                values: ['aviation', 'rail', 'road', 'general_transport']
      - name: forecast_valid_date
        description: "Forecast valid date for the risk record."
        data_tests: [not_null]
      - name: horizon_hours
        description: "Forecast horizon in hours."
      - name: absolute_temperature_error_c
        description: "Absolute temperature forecast error in Celsius."
      - name: absolute_precipitation_error_mm
        description: "Absolute precipitation forecast error in millimetres."
      - name: absolute_wind_gust_error_kph
        description: "Absolute wind gust forecast error in kilometres per hour."
      - name: forecast_uncertainty_score
        description: "Risk score based on forecast uncertainty."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 3
      - name: data_service_adoption_key
        description: "Regional data-service adoption surrogate key from the data services project."
      - name: active_subscription_count
        description: "Active data-service subscriptions in the forecast region."
      - name: active_api_calls_30d
        description: "API calls from active subscriptions in the prior 30 days for the forecast region."
      - name: alert_opt_in_rate
        description: "Share of regional subscriptions opted into alert notifications."
      - name: adoption_band
        description: "Regional data-service adoption segment."
        data_tests:
          - accepted_values:
              arguments:
                values: ['developing_adoption', 'moderate_adoption', 'high_adoption']
      - name: max_alert_severity_weight
        description: "Maximum alert severity weight for the station and date."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3
      - name: max_weighted_impact_score
        description: "Maximum weighted impact score for the station and date."
      - name: operating_risk_score
        description: "Combined forecast uncertainty and alert severity risk score."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1

  - name: transport_aviation_operating_risk
    description: "Final operating risk report for transport and aviation stakeholders."
    config:
      meta:
        primary_key: operating_risk_key
    columns:
      - name: operating_risk_key
        description: "Surrogate key for date, region, and sector."
        data_tests: [not_null, unique]
      - name: forecast_valid_date
        description: "Forecast valid date for the risk summary."
        data_tests: [not_null]
      - name: region
        description: "Operational weather-service region."
        data_tests: [not_null]
      - name: operating_sector
        description: "Transport operating sector for the risk summary."
        data_tests:
          - accepted_values:
              arguments:
                values: ['aviation', 'rail', 'road']
      - name: data_service_adoption_key
        description: "Regional data-service adoption surrogate key from the data services project."
      - name: station_count
        description: "Number of distinct stations included in the summary."
      - name: active_subscription_count
        description: "Active data-service subscriptions in the risk-summary region."
      - name: active_api_calls_30d
        description: "API calls from active subscriptions in the prior 30 days for the risk-summary region."
      - name: alert_opt_in_rate
        description: "Share of regional subscriptions opted into alert notifications."
      - name: adoption_band
        description: "Regional data-service adoption segment."
        data_tests:
          - accepted_values:
              arguments:
                values: ['developing_adoption', 'moderate_adoption', 'high_adoption']
      - name: average_temperature_error_c
        description: "Average absolute temperature forecast error in Celsius."
      - name: average_precipitation_error_mm
        description: "Average absolute precipitation forecast error in millimetres."
      - name: average_wind_gust_error_kph
        description: "Average absolute wind gust forecast error in kilometres per hour."
      - name: max_operating_risk_score
        description: "Maximum operating risk score in the segment."
      - name: average_operating_risk_score
        description: "Average operating risk score in the segment."
      - name: operating_risk_band
        description: "Named risk band for operational planning."
        data_tests:
          - accepted_values:
              arguments:
                values: ['normal_operations', 'heightened_watch', 'disruption_likely']

  - name: daily_station_operating_posture
    description: "Station-day operating posture base combining observed conditions, forecast accuracy, and alert impact."
    config:
      meta:
        primary_key: station_daily_conditions_key
    columns:
      - name: station_daily_conditions_key
        description: "Foundation station-day conditions surrogate key."
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station represented by the posture record."
        data_tests: [not_null]
      - name: station_name
        description: "Human-readable station name."
      - name: region
        description: "Operational weather-service region."
        data_tests: [not_null]
      - name: station_type
        description: "Station operating context."
      - name: sector_focus
        description: "Primary sector supported by the station."
      - name: operating_sector
        description: "Transport operating sector inferred from station context."
        data_tests:
          - accepted_values:
              arguments:
                values: ['aviation', 'rail', 'road', 'general_transport']
      - name: posture_date
        description: "Date of the operating posture record."
        data_tests: [not_null]
      - name: observation_count
        description: "Number of observations contributing to the station-day."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: average_temperature_c
        description: "Average observed air temperature in Celsius."
      - name: total_precipitation_mm
        description: "Total observed precipitation in millimetres."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: maximum_wind_gust_kph
        description: "Maximum observed wind gust speed in kilometres per hour."
      - name: minimum_visibility_km
        description: "Minimum observed visibility in kilometres."
      - name: low_visibility_observed
        description: "Whether low visibility was observed during the station-day."
      - name: high_wind_observed
        description: "Whether high wind was observed during the station-day."
      - name: freezing_observed
        description: "Whether freezing conditions were observed during the station-day."
      - name: average_temperature_error_c
        description: "Average absolute temperature forecast error in Celsius."
      - name: average_precipitation_error_mm
        description: "Average absolute precipitation forecast error in millimetres."
      - name: average_wind_gust_error_kph
        description: "Average absolute wind gust forecast error in kilometres per hour."
      - name: precipitation_miss_observed
        description: "Whether precipitation event classification missed on the station-day."
      - name: alert_count
        description: "Alert count for the station-day."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: maximum_alert_severity_weight
        description: "Maximum alert severity weight for the station-day."
      - name: maximum_weighted_impact_score
        description: "Maximum weighted alert impact score for the station-day."
      - name: observed_incidents
        description: "Observed incidents associated with station-day alerts."
      - name: operating_posture_score
        description: "Combined operating posture score from conditions, forecast uncertainty, and alerts."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1

  - name: transport_aviation_daily_operating_posture
    description: "Daily transport and aviation operating posture report by region and operating sector."
    config:
      meta:
        primary_key: daily_operating_posture_key
    columns:
      - name: daily_operating_posture_key
        description: "Surrogate key for posture date, region, and operating sector."
        data_tests: [not_null, unique]
      - name: posture_date
        description: "Date of the operating posture summary."
        data_tests: [not_null]
      - name: region
        description: "Operational weather-service region."
        data_tests: [not_null]
      - name: operating_sector
        description: "Transport operating sector for the posture summary."
        data_tests:
          - accepted_values:
              arguments:
                values: ['aviation', 'rail', 'road']
      - name: station_count
        description: "Number of distinct stations included in the posture summary."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: observation_count
        description: "Number of observations included in the posture summary."
      - name: average_temperature_error_c
        description: "Average absolute temperature forecast error in Celsius."
      - name: average_precipitation_error_mm
        description: "Average absolute precipitation forecast error in millimetres."
      - name: average_wind_gust_error_kph
        description: "Average absolute wind gust forecast error in kilometres per hour."
      - name: maximum_wind_gust_kph
        description: "Maximum observed wind gust speed in kilometres per hour."
      - name: minimum_visibility_km
        description: "Minimum observed visibility in kilometres."
      - name: low_visibility_station_count
        description: "Stations with low visibility observed."
      - name: high_wind_station_count
        description: "Stations with high wind observed."
      - name: freezing_station_count
        description: "Stations with freezing conditions observed."
      - name: alert_count
        description: "Alert count in the posture summary."
      - name: observed_incidents
        description: "Observed incidents associated with alerts in the posture summary."
      - name: maximum_operating_posture_score
        description: "Maximum station operating posture score in the summary."
      - name: average_operating_posture_score
        description: "Average station operating posture score in the summary."
      - name: disruption_posture
        description: "Named disruption posture for operational planning."
        data_tests:
          - accepted_values:
              arguments:
                values: ['normal_operations', 'heightened_watch', 'disruption_likely']
