version: 2

models:
  - name: warning_station_alerts
    description: "Warning resilience reporting base built only from public foundation marts."
    config:
      meta:
        primary_key: alert_impact_key
    columns:
      - name: alert_impact_key
        description: "Foundation alert impact surrogate key."
        data_tests: [not_null, unique]
      - name: alert_id
        description: "Stable alert identifier from the foundation alert impact fact."
        data_tests: [not_null, unique]
      - name: station_key
        description: "Foundation station surrogate key."
        data_tests: [not_null]
      - name: station_id
        description: "Station most directly associated with the alert."
        data_tests: [not_null]
      - name: station_name
        description: "Human-readable station name."
      - name: region
        description: "Operational weather-service region."
        data_tests: [not_null]
      - name: station_type
        description: "Station operating context."
      - name: sector_focus
        description: "Primary sector supported by the station."
      - name: issued_at
        description: "Timestamp the alert was issued."
      - name: valid_from
        description: "Timestamp the alert validity window starts."
      - name: valid_to
        description: "Timestamp the alert validity window ends."
      - name: alert_duration_hours
        description: "Alert validity duration in hours."
      - name: severity
        description: "Alert severity level."
        data_tests:
          - accepted_values:
              arguments:
                values: ['yellow', 'amber', 'red']
      - name: alert_type
        description: "Alert hazard type."
      - name: status
        description: "Current alert lifecycle status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['issued', 'expired', 'cancelled']
      - name: expected_impact_score
        description: "Expected service impact score."
      - name: observed_incidents
        description: "Observed incident count associated with the alert."
      - name: affected_population_estimate
        description: "Estimated population covered by the alert."
      - name: incidents_per_100k_population
        description: "Observed incidents per 100,000 affected residents."
      - name: data_service_adoption_key
        description: "Regional data-service adoption surrogate key from the data services project."
      - name: active_subscription_count
        description: "Active data-service subscriptions in the alert region."
      - name: active_api_calls_30d
        description: "API calls from active subscriptions in the prior 30 days for the alert region."
      - name: alert_opt_in_rate
        description: "Share of regional subscriptions opted into alert notifications."
      - name: adoption_band
        description: "Regional data-service adoption segment."
        data_tests:
          - accepted_values:
              arguments:
                values: ['developing_adoption', 'moderate_adoption', 'high_adoption']
      - name: weighted_impact_score
        description: "Expected impact score multiplied by severity weight."
      - name: resilience_response_tier
        description: "Operational response tier for resilience teams."
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard_monitoring', 'enhanced_monitoring', 'major_incident_ready']

  - name: warning_coverage_report
    description: "Final report of alert coverage, incidents, and response posture by region, hazard, and severity."
    semantic_model:
      enabled: true
      name: warning_coverage_report
    agg_time_dimension: metric_date
    config:
      meta:
        primary_key: warning_coverage_key
    columns:
      - name: warning_coverage_key
        description: "Surrogate key for region, alert type, and severity."
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: warning_coverage
      - name: metric_date
        description: "Current date used as the warning coverage metric date."
        granularity: day
        dimension:
          type: time
      - name: region
        description: "Operational weather-service region."
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: alert_type
        description: "Alert hazard type."
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: severity
        description: "Alert severity level."
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['yellow', 'amber', 'red']
      - name: data_service_adoption_key
        description: "Regional data-service adoption surrogate key from the data services project."
      - name: alert_count
        description: "Number of alerts in the segment."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: station_count
        description: "Number of distinct stations covered by the segment."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: active_subscription_count
        description: "Active data-service subscriptions in the warning-coverage region."
      - name: active_api_calls_30d
        description: "API calls from active subscriptions in the prior 30 days for the warning-coverage region."
      - name: alert_opt_in_rate
        description: "Share of regional subscriptions opted into alert notifications."
      - name: adoption_band
        description: "Regional data-service adoption segment."
        data_tests:
          - accepted_values:
              arguments:
                values: ['developing_adoption', 'moderate_adoption', 'high_adoption']
      - name: observed_incidents
        description: "Total observed incidents in the segment."
      - name: affected_population_estimate
        description: "Estimated affected population across the segment."
      - name: average_expected_impact_score
        description: "Average expected impact score across alerts in the segment."
      - name: average_weighted_impact_score
        description: "Average severity-weighted impact score across alerts in the segment."
      - name: highest_response_tier
        description: "Highest response tier observed in the segment."
        dimension:
          type: categorical
      - name: incidents_per_100k_population
        description: "Observed incidents per 100,000 affected residents."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
    metrics:
      - name: warning_alert_count
        description: "Count of warning alerts."
        type: simple
        label: "Warning alert count"
        agg: sum
        expr: alert_count
      - name: warning_incident_count
        description: "Observed incident count in warning reports."
        type: simple
        label: "Warning incident count"
        agg: sum
        expr: observed_incidents
      - name: warning_affected_population
        description: "Estimated affected population in warning reports."
        type: simple
        label: "Warning affected population"
        agg: sum
        expr: affected_population_estimate
      - name: warning_weighted_impact
        description: "Average weighted impact score in warning reports."
        type: simple
        label: "Warning weighted impact"
        agg: average
        expr: average_weighted_impact_score

  - name: daily_resilience_station_posture
    description: "Station-day resilience posture base combining warning coverage with observed weather conditions."
    config:
      meta:
        primary_key: station_daily_conditions_key
    columns:
      - name: station_daily_conditions_key
        description: "Foundation station-day conditions surrogate key."
        data_tests: [not_null, unique]
      - name: station_id
        description: "Station represented by the resilience posture record."
        data_tests: [not_null]
      - name: station_name
        description: "Human-readable station name."
      - name: region
        description: "Operational weather-service region."
        data_tests: [not_null]
      - name: station_type
        description: "Station operating context."
      - name: sector_focus
        description: "Primary sector supported by the station."
      - name: posture_date
        description: "Date of the resilience posture record."
        data_tests: [not_null]
      - name: observation_count
        description: "Number of observations contributing to the station-day."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: total_precipitation_mm
        description: "Total observed precipitation in millimetres."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: maximum_wind_gust_kph
        description: "Maximum observed wind gust speed in kilometres per hour."
      - name: minimum_visibility_km
        description: "Minimum observed visibility in kilometres."
      - name: precipitation_observed
        description: "Whether precipitation was observed during the station-day."
      - name: low_visibility_observed
        description: "Whether low visibility was observed during the station-day."
      - name: high_wind_observed
        description: "Whether high wind was observed during the station-day."
      - name: freezing_observed
        description: "Whether freezing conditions were observed during the station-day."
      - name: alert_count
        description: "Alert count for the station-day."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: observed_incidents
        description: "Observed incidents associated with station-day alerts."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: affected_population_estimate
        description: "Estimated affected population associated with station-day alerts."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: average_expected_impact_score
        description: "Average expected impact score for station-day alerts."
      - name: average_weighted_impact_score
        description: "Average severity-weighted impact score for station-day alerts."
      - name: maximum_weighted_impact_score
        description: "Maximum severity-weighted impact score for station-day alerts."
      - name: resilience_posture
        description: "Operational response posture for resilience teams."
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard_monitoring', 'enhanced_monitoring', 'major_incident_ready']

  - name: daily_resilience_posture_report
    description: "Daily resilience posture report by region, combining warning outcomes and observed conditions."
    semantic_model:
      enabled: true
      name: daily_resilience_posture_report
    agg_time_dimension: posture_date
    config:
      meta:
        primary_key: daily_resilience_posture_key
    columns:
      - name: daily_resilience_posture_key
        description: "Surrogate key for posture date and region."
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: daily_resilience_posture
      - name: posture_date
        description: "Date of the resilience posture summary."
        granularity: day
        dimension:
          type: time
        data_tests: [not_null]
      - name: region
        description: "Operational weather-service region."
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: station_count
        description: "Number of distinct stations included in the posture summary."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: observation_count
        description: "Number of observations included in the posture summary."
      - name: precipitation_station_count
        description: "Stations with precipitation observed."
      - name: low_visibility_station_count
        description: "Stations with low visibility observed."
      - name: high_wind_station_count
        description: "Stations with high wind observed."
      - name: freezing_station_count
        description: "Stations with freezing conditions observed."
      - name: alert_count
        description: "Alert count in the posture summary."
      - name: observed_incidents
        description: "Observed incidents associated with alerts in the posture summary."
      - name: affected_population_estimate
        description: "Estimated affected population associated with alerts in the posture summary."
      - name: average_expected_impact_score
        description: "Average expected impact score across alerted station-days."
      - name: average_weighted_impact_score
        description: "Average severity-weighted impact score across alerted station-days."
      - name: maximum_weighted_impact_score
        description: "Maximum severity-weighted impact score in the posture summary."
      - name: highest_resilience_posture
        description: "Highest resilience response posture observed in the summary."
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard_monitoring', 'enhanced_monitoring', 'major_incident_ready']
      - name: incidents_per_100k_population
        description: "Observed incidents per 100,000 affected residents."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
